<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Cart</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f8f9fa;
      margin: 0;
      padding: 20px;
    }
    .cart-section {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      background-color: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    .cart-header {
      text-align: center;
      margin-bottom: 20px;
    }
    .cart-container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }
    .cart-item {
      flex: 1 1 calc(33.33% - 20px);
      background-color: #f1f1f1;
      padding: 10px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      text-align: center;
    }
    .cart-item img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
    }
    .cart-item h6 {
      margin: 10px 0;
    }
    .cart-item p {
      font-size: 14px;
      color: #777;
    }
    .cart-item .price {
      font-weight: bold;
      color: #333;
    }
    .cart-item .quantity {
      margin-top: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }
    .cart-item .quantity button {
      background-color: #f79d42;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 5px;
      cursor: pointer;
    }
    .cart-item .quantity button:hover {
      background-color: #f76c2b;
    }
    .cart-item .delete-btn {
      margin-top: 10px;
      background-color: #f76c6c;
      color: white;
      padding: 8px 15px;
      border: none;
      font-size: 14px;
      border-radius: 5px;
      cursor: pointer;
    }
    .cart-item .delete-btn:hover {
      background-color: #f74c3c;
    }
    .empty-cart {
      text-align: center;
      font-size: 18px;
      color: #888;
    }
    .checkout-btn {
      display: block;
      width: 100%;
      padding: 10px;
      background-color: #f79d42;
      color: white;
      border: none;
      font-size: 16px;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 20px;
    }
    .checkout-btn:hover {
      background-color: #f76c2b;
    }
  </style>
</head>
<body>

  <section class="cart-section">
    <div class="cart-header">
      <h2>My Cart</h2>
    </div>

    <div class="cart-container" id="cart-container">
      <!-- Cart items will be dynamically loaded here -->
    </div>

    <button class="checkout-btn" id="checkout-btn">Proceed to Checkout</button>
  </section>

  <script>
    // Fetch cart items from localStorage
    const cart = JSON.parse(localStorage.getItem('cart')) || [];

    const cartContainer = document.getElementById('cart-container');
    const checkoutBtn = document.getElementById('checkout-btn');

    // If the cart is empty, display a message
    if (cart.length === 0) {
      cartContainer.innerHTML = '<p class="empty-cart">Your cart is empty!</p>';
      checkoutBtn.disabled = true; // Disable the checkout button if the cart is empty
    } else {
      // Loop through each cart item and display it
      cart.forEach((item, index) => {
        const cartItem = document.createElement('div');
        cartItem.classList.add('cart-item');
        cartItem.innerHTML = `
          <img src="${item.image}" alt="${item.name}">
          <h6>${item.name}</h6>
          <p>${item.description}</p>
          <div class="price">₹${item.price}</div>
          <div class="quantity">
            <button class="decrease-btn" data-index="${index}">-</button>
            <span class="item-quantity">${item.quantity}</span>
            <button class="increase-btn" data-index="${index}">+</button>
          </div>
          <button class="delete-btn" data-index="${index}">Delete</button>
        `;
        cartContainer.appendChild(cartItem);
      });
    }

    // Increase item quantity
    cartContainer.addEventListener('click', function(event) {
      if (event.target.classList.contains('increase-btn')) {
        const index = event.target.getAttribute('data-index');
        cart[index].quantity++;
        localStorage.setItem('cart', JSON.stringify(cart));
        updateCart();
      }
    });

    // Decrease item quantity
    cartContainer.addEventListener('click', function(event) {
      if (event.target.classList.contains('decrease-btn')) {
        const index = event.target.getAttribute('data-index');
        if (cart[index].quantity > 1) {
          cart[index].quantity--;
          localStorage.setItem('cart', JSON.stringify(cart));
          updateCart();
        }
      }
    });

    // Delete item from cart
    cartContainer.addEventListener('click', function(event) {
      if (event.target.classList.contains('delete-btn')) {
        const index = event.target.getAttribute('data-index');
        cart.splice(index, 1);
        localStorage.setItem('cart', JSON.stringify(cart));
        updateCart();
      }
    });

    // Update the cart UI
    function updateCart() {
      cartContainer.innerHTML = '';
      if (cart.length === 0) {
        cartContainer.innerHTML = '<p class="empty-cart">Your cart is empty!</p>';
        checkoutBtn.disabled = true;
      } else {
        cart.forEach((item, index) => {
          const cartItem = document.createElement('div');
          cartItem.classList.add('cart-item');
          cartItem.innerHTML = `
            <img src="${item.image}" alt="${item.name}">
            <h6>${item.name}</h6>
            <p>${item.description}</p>
            <div class="price">₹${item.price}</div>
            <div class="quantity">
              <button class="decrease-btn" data-index="${index}">-</button>
              <span class="item-quantity">${item.quantity}</span>
              <button class="increase-btn" data-index="${index}">+</button>
            </div>
            <button class="delete-btn" data-index="${index}">Delete</button>
          `;
          cartContainer.appendChild(cartItem);
        });
      }
    }

    // Checkout button logic
    checkoutBtn.addEventListener('click', function() {
      alert('Proceeding to checkout!');
      // You can add logic here to redirect to a checkout page
      // window.location.href = "checkout.html";
    });
  </script>

</body>
</html>
